<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKIM Scripting Challenge</title>
  <link rel="stylesheet" href="styles.css">

  <script>
    
    try {
      var savedTheme = localStorage.getItem("skim-theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (error) {
      // localStorage throws in private windows and when site data is blocked.
      // Nothing to recover: with no saved choice we fall back to the system setting.
    }
  </script>
</head>

<body>
  <header class="site-header">
    <h1 class="site-header__title">SKIM Scripting Challenge</h1>
    <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
  </header>

  <!-- The two challenges. Stacked by default, side by side from 768px up. -->
  <main class="layout">

    <!-- ============ Challenge 1 — factorial ============ -->
    <section class="card" aria-labelledby="factorial-title">
      <h2 class="card__title" id="factorial-title">Challenge 1 - Factorial</h2>

      <form class="card__form" id="factorial-form" novalidate>
        <label class="field__label" for="factorial-input">
          Enter an integer between 1 and 18
        </label>
        <input
          class="field__input"
          id="factorial-input"
          name="factorial"
          type="number"
          min="1"
          max="18"
          step="1"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 8">
        <button class="button" type="submit">Calculate</button>
      </form>

      <p class="message" id="factorial-message" role="alert"></p>

      <div class="result" aria-live="polite">
        <span class="result__label">Result</span>
        <output class="result__value" id="factorial-output" for="factorial-input">-</output>
      </div>
    </section>

    <!-- ============ Challenge 2 — console logger ============ -->
    <section class="card" aria-labelledby="logger-title">
      <h2 class="card__title" id="logger-title">Challenge 2 - Console logger</h2>
      <form class="card__form" id="logger-form" novalidate>
        <label class="field__label" for="logger-input">
          Enter an integer between 1 and 100
        </label>
        <input
          class="field__input"
          id="logger-input"
          name="limit"
          type="number"
          min="1"
          max="100"
          step="1"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 15">
        <button class="button" type="submit">Log to console</button>
      </form>

      <p class="message" id="logger-message" role="alert"></p>

      <div class="result" aria-live="polite">
        <span class="result__label">Console</span>
        <output class="result__value result__value--text" id="logger-output" for="logger-input">
          Output goes to the browser console - press F12 and choose the Console tab.
        </output>
      </div>
    </section>

  </main>

 
  <script src="script.js" defer></script>
</body>
</html>
